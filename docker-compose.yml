version: '3'

services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    ports:
      - "8080:8080"  # 映射Web服務端口
    volumes:
      - ./logs:/app/logs
      - ./setting.json:/app/setting.json
      - ./assets:/app/assets
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1  # 確保Python輸出不被緩存，方便查看日誌
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('discord.com', 443))"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 