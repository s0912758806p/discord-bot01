services:
  discord-bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    # 增加啟動等待時間，有利於穩定初始化
    stop_grace_period: 30s
    init: true
    volumes:
      - ./logs:/app/logs
      - ./setting.json:/app/setting.json
      - ./assets:/app/assets
      - ./config:/app/config  # 額外掛載配置目錄
      - ./data:/app/data      # 額外掛載資料目錄
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'
    # 使用host網絡以改善網絡連接性能
    # 注意：在某些環境中可能需要取消註釋此選項
    # network_mode: "host"
    networks:
      - bot-network
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"

networks:
  bot-network:
    driver: bridge 