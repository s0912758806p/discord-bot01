[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio：未標記的 async def 測試也會執行（否則會被靜默跳過）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: 單元測試
    system: 系統測試
    slow: 慢速測試，可以跳過用 -m "not slow"
    vm: VM環境特定測試

addopts = -v
