[pytest]
# 設置測試目錄
testpaths = tests

# 設置測試文件命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 設置測試標記
markers =
    unit: 單元測試
    integration: 整合測試
    system: 系統測試
    slow: 慢速測試，可以跳過用 -m "not slow"
    vm: VM環境特定測試

# 顯示測試進度和詳細信息
addopts = --verbose

# 測試覆蓋率配置
[coverage:run]
source = cmds
omit = 
    */__pycache__/*
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError

# 日誌配置
[log_cli]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S 